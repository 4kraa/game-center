<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>SANDBOX — Satisfying</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1a1a1a;font-family:-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
#menu{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;background:rgba(0,0,0,.5);padding:8px;border-radius:50px;backdrop-filter:blur(10px)}
.btn{padding:10px 20px;background:transparent;border:none;color:#888;font-size:14px;font-weight:600;cursor:pointer;border-radius:50px;transition:all .2s}
.btn:hover{color:#fff}
.btn.active{background:#fff;color:#000}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:12px;text-align:center;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu">
  <button class="btn active" data-tool="slime">SLIME</button>
  <button class="btn" data-tool="bubbles">BULLES</button>
  <button class="btn" data-tool="sand">SABLE</button>
</div>
<div id="info">Glisse pour interagir</div>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  const r=window.devicePixelRatio||1;DPR=Math.min(2,r);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();window.addEventListener('resize',resize);

// Audio
let AC=null;
function initAudio(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playSound(freq,dur,type,vol){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.1);
}
function popSound(){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(100,t+.08);
  g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.1);
}
function squishSound(){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(300,t+.2);
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);
}

// State
let currentTool='slime';
let mouse={x:0,y:0,down:false,prevX:0,prevY:0};

// Input
function setMouse(e){
  e.preventDefault();
  mouse.prevX=mouse.x;mouse.prevY=mouse.y;
  const t=e.touches?e.touches[0]:e;
  mouse.x=t.clientX;mouse.y=t.clientY;
}
cv.addEventListener('pointerdown',e=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();mouse.down=true;setMouse(e);if(currentTool==='bubbles')checkBubbles();});
cv.addEventListener('pointermove',e=>{setMouse(e);if(mouse.down&&currentTool==='sand')cutSand();});
cv.addEventListener('pointerup',()=>mouse.down=false);
cv.addEventListener('pointercancel',()=>mouse.down=false);

// Menu
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentTool=b.dataset.tool;
  ctx.clearRect(0,0,W,H);
  if(currentTool==='bubbles')initBubbles();
  if(currentTool==='sand')initSand();
  if(currentTool==='slime')initSlime();
}));

// ==========================================
// 1. SLIME (Verlet Physics)
// ==========================================
let slime={points:[],sticks:[],drag:null};

function initSlime(){
  const cx=W/2,cy=H/2;
  const r=Math.min(W,H)*0.25;
  const n=24;
  slime.points=[];slime.sticks=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    slime.points.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,px:cx+Math.cos(a)*r,py:cy+Math.sin(a)*r});
  }
  // Center point for structure
  slime.points.push({x:cx,y:cy,px:cx,py:cy,pinned:true});
  const center=n; // index
  // Edge springs
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d});
  }
  // Cross springs to center for structure
  for(let i=0;i<n;i+=2){
    const d=Math.hypot(slime.points[i].x-cx,slime.points[i].y-cy);
    slime.sticks.push({p1:i,p2:center,len:d,k:.3}); // softer spring
  }
  // Cross springs across for stability
  for(let i=0;i<n/2;i++){
    const j=i+n/2;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d,k:.1}); // very soft
  }
}

function updateSlime(){
  if(slime.points.length===0)return;
  if(mouse.down&&!slime.drag){
    let minD=99999,closest=null;
    slime.points.forEach((p,i)=>{
      if(i===slime.points.length-1)return; // skip center
      const d=Math.hypot(mouse.x-p.x,mouse.y-p.y);
      if(d<minD){minD=d;closest=i;}
    });
    if(minD<100)slime.drag=closest;
  }
  if(!mouse.down)slime.drag=null;

  // Verlet
  slime.points.forEach((p,i)=>{
    if(p.pinned||i===slime.drag)return;
    const vx=(p.x-p.px)*0.98;
    const vy=(p.y-p.py)*0.98;
    p.px=p.x;p.py=p.y;
    p.x+=vx;p.y+=vy;
    p.y+=0.5; // gravity
  });
  if(slime.drag!==null){
    slime.points[slime.drag].x=mouse.x;
    slime.points[slime.drag].y=mouse.y;
  }
  // Constraints
  for(let k=0;k<3;k++){
    slime.sticks.forEach(s=>{
      const p1=slime.points[s.p1],p2=slime.points[s.p2];
      const dx=p2.x-p1.x,dy=p2.y-p1.y;
      const d=Math.hypot(dx,dy)||1;
      const diff=(s.len-d)/d*(s.k||1)*0.5;
      const ox=dx*diff,oy=dy*diff;
      if(!p1.pinned&&s.p1!==slime.drag){p1.x-=ox;p1.y-=oy;}
      if(!p2.pinned&&s.p2!==slime.drag){p2.x+=ox;p2.y+=oy;}
    });
    // Bounds
    slime.points.forEach(p=>{
      if(p.pinned)return;
      if(p.x<10)p.x=10;if(p.x>W-10)p.x=W-10;
      if(p.y<10)p.y=10;if(p.y>H-10)p.y=H-10;
    });
  }
}

function drawSlime(){
  if(slime.points.length===0)return;
  // Smooth curve through edge points
  const pts=slime.points.slice(0,-1); // exclude center
  ctx.beginPath();
  ctx.moveTo((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2);
  for(let i=1;i<pts.length;i++){
    const p1=pts[i],p2=pts[(i+1)%pts.length];
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    ctx.quadraticCurveTo(p1.x,p1.y,mx,my);
  }
  ctx.closePath();
  // Fill with gradient
  const cx=W/2,cy=H/2;
  const grad=ctx.createRadialGradient(cx-50,cy-50,0,cx,cy,300);
  grad.addColorStop(0,'#00d9ff');
  grad.addColorStop(1,'#7c5cff');
  ctx.fillStyle=grad;
  ctx.fill();
  // Shine
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.fill();
}

// ==========================================
// 2. BUBBLES (Bubble Wrap)
// ==========================================
let bubbles=[];

function initBubbles(){
  bubbles=[];
  const r=20;
  const gap=4;
  const cols=Math.floor((W-20)/(r*2+gap));
  const rows=Math.floor((H-20)/(r*2+gap));
  const startX=(W-cols*(r*2+gap))/2;
  const startY=(H-rows*(r*2+gap))/2;
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      bubbles.push({
        x:startX+x*(r*2+gap)+r,
        y:startY+y*(r*2+gap)+r,
        r:r,popped:false,popT:0,
        hue:rand(180,280)
      });
    }
  }
}

function rand(a,b){return a+Math.random()*(b-a);}

function checkBubbles(){
  let popped=false;
  bubbles.forEach(b=>{
    if(b.popped)return;
    const d=Math.hypot(mouse.x-b.x,mouse.y-b.y);
    if(d<b.r){
      b.popped=true;b.popT=1;
      popped=true;
    }
  });
  if(popped)popSound();
}

function updateBubbles(){
  bubbles.forEach(b=>{
    if(b.popT>0)b.popT-=0.1;
  });
}

function drawBubbles(){
  bubbles.forEach(b=>{
    if(b.popped&&b.popT<=0)return;
    if(b.popped){
      // Pop animation: expanding ring
      ctx.strokeStyle=`hsla(${b.hue}, 80%, 60%, ${b.popT})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+(1-b.popT)*15,0,Math.PI*2);ctx.stroke();
    }else{
      // 3D Bubble
      const grad=ctx.createRadialGradient(b.x-b.r/3,b.y-b.r/3,0,b.x,b.y,b.r);
      grad.addColorStop(0,`hsla(${b.hue}, 80%, 80%, .9)`);
      grad.addColorStop(1,`hsla(${b.hue}, 80%, 50%, .9)`);
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      // Shine
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath();ctx.arc(b.x-b.r/3,b.y-b.r/3,b.r/4,0,Math.PI*2);ctx.fill();
    }
  });
}

// ==========================================
// 3. SAND (Cutting)
// ==========================================
let sandCanvas, sandCtx;
let initialized=false;

function initSand(){
  // Create offscreen canvas for the sand texture
  sandCanvas=document.createElement('canvas');
  sandCanvas.width=W;sandCanvas.height=H;
  sandCtx=sandCanvas.getContext('2d');
  // Fill with sand color
  const grad=sandCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#f4a261');
  grad.addColorStop(1,'#e76f51');
  sandCtx.fillStyle=grad;
  sandCtx.fillRect(0,0,W,H);
  // Add texture noise
  for(let i=0;i<5000;i++){
    sandCtx.fillStyle=`rgba(255,255,255,${Math.random()*0.3})`;
    sandCtx.fillRect(Math.random()*W,Math.random()*H,1,1);
  }
}

function cutSand(){
  if(!sandCtx)return;
  // Erase sand on the offscreen canvas
  sandCtx.globalCompositeOperation='destination-out';
  sandCtx.lineWidth=50;
  sandCtx.lineCap='round';
  sandCtx.lineJoin='round';
  sandCtx.beginPath();
  sandCtx.moveTo(mouse.prevX,mouse.prevY);
  sandCtx.lineTo(mouse.x,mouse.y);
  sandCtx.stroke();
  sandCtx.globalCompositeOperation='source-over';
}

function drawSand(){
  // 1. Draw the background (grid) on main canvas
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // 2. Draw the sand texture (which has holes cut out) on top
  ctx.drawImage(sandCanvas,0,0);
}

// ==========================================
// LOOP
// ==========================================
function loop(){
  ctx.clearRect(0,0,W,H);
  if(currentTool==='slime'){
    updateSlime();drawSlime();
  }else if(currentTool==='bubbles'){
    updateBubbles();drawBubbles();
  }else if(currentTool==='sand'){
    drawSand();
  }
  requestAnimationFrame(loop);
}

initSlime();
loop();
</script>
</body>
</html>
