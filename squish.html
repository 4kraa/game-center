<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>SANDBOX — Satisfying</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0e;font-family:-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#menu{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:rgba(0,0,0,.5);padding:6px;border-radius:100px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.btn{padding:10px 22px;background:transparent;border:none;color:rgba(255,255,255,.4);font-size:13px;font-weight:700;cursor:pointer;border-radius:100px;transition:all .25s cubic-bezier(.34,1.56,.64,1);letter-spacing:1px}
.btn:hover{color:rgba(255,255,255,.7)}
.btn.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:12px;text-align:center;pointer-events:none;letter-spacing:1px}
#reset{position:fixed;top:16px;right:16px;z-index:10;padding:8px 16px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:12px;font-weight:600;cursor:pointer;border-radius:100px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .2s}
#reset:hover{color:#fff;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu">
  <button class="btn active" data-tool="slime">SLIME</button>
  <button class="btn" data-tool="bubbles">BULLES</button>
  <button class="btn" data-tool="sand">SABLE</button>
</div>
<button id="reset">↻ RESET</button>
<div id="info">Glisse pour interagir</div>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  const r=window.devicePixelRatio||1;DPR=Math.min(2,r);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize',()=>{resize();if(currentTool==='slime')initSlime();if(currentTool==='bubbles')initBubbles();if(currentTool==='sand')initSand();});

// Audio
let AC=null;
function initAudio(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,dur,type,vol,f2){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
function noiseBurst(dur,vol,freq,type){
  if(!AC)return;const t=AC.currentTime;
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||2000;
  const g=AC.createGain();g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
function popSound(pitch){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(900*pitch,t);o.frequency.exponentialRampToValueAtTime(80,t+.06);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.1);
  noiseBurst(.06,.05,3000,'highpass');
}
function squishSound(intensity){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(80,t);
  o.frequency.linearRampToValueAtTime(80+intensity*200,t+.15);
  g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2);
  noiseBurst(.1,.03,800,'lowpass');
}
function sandSound(){
  if(!AC)return;
  noiseBurst(.08,.04,1500,'bandpass');
}

// State
let currentTool='slime';
let mouse={x:0,y:0,down:false,prevX:0,prevY:0};
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];

// Input
function setMouse(e){
  e.preventDefault();
  mouse.prevX=mouse.x;mouse.prevY=mouse.y;
  mouse.x=e.clientX;mouse.y=e.clientY;
}
cv.addEventListener('pointerdown',e=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();mouse.down=true;setMouse(e);if(currentTool==='bubbles')checkBubbles();if(currentTool==='slime')grabSlime();if(currentTool==='sand')cutSand();});
cv.addEventListener('pointermove',e=>{setMouse(e);if(mouse.down){if(currentTool==='sand')cutSand();if(currentTool==='slime')dragSlime();if(currentTool==='bubbles')checkBubbles();}});
cv.addEventListener('pointerup',()=>{mouse.down=false;if(currentTool==='slime')releaseSlime();});
cv.addEventListener('pointercancel',()=>{mouse.down=false;if(currentTool==='slime')releaseSlime();});

// Menu
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentTool=b.dataset.tool;
  if(currentTool==='bubbles')initBubbles();
  if(currentTool==='sand')initSand();
  if(currentTool==='slime')initSlime();
}));
document.getElementById('reset').addEventListener('click',()=>{
  if(currentTool==='slime')initSlime();
  if(currentTool==='bubbles')initBubbles();
  if(currentTool==='sand')initSand();
});

// ==========================================
// 1. SLIME — FIXED (no pinned center, free body)
// ==========================================
let slime={points:[],sticks:[],drag:null};

function initSlime(){
  const cx=W/2,cy=H/2;
  const r=Math.min(W,H)*0.2;
  const n=28;
  slime.points=[];slime.sticks=[];slime.drag=null;
  // Edge points
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    slime.points.push({x:px,y:py,px,py});
  }
  // Perimeter springs
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d,k:1});
  }
  // Diagonal springs (across) for shape retention — soft
  for(let i=0;i<n/2;i++){
    const j=(i+(n/2|0))%n;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d,k:.08});
  }
  // Next-neighbor springs (smoother edges)
  for(let i=0;i<n;i++){
    const j=(i+2)%n;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d,k:.2});
  }
  // Every 3rd point to center-ish (but no pinned center)
  // Create internal structural springs from every 4th point to opposite
  for(let i=0;i<n/4;i++){
    const j=(i+(n/4|0)*3)%n;
    const d=Math.hypot(slime.points[i].x-slime.points[j].x,slime.points[i].y-slime.points[j].y);
    slime.sticks.push({p1:i,p2:j,len:d,k:.05});
  }
}

function grabSlime(){
  let minD=99999,closest=null;
  slime.points.forEach((p,i)=>{
    const d=Math.hypot(mouse.x-p.x,mouse.y-p.y);
    if(d<minD){minD=d;closest=i;}
  });
  if(minD<150){
    slime.drag=closest;
    squishSound(.5);
  }
}

function dragSlime(){
  if(slime.drag!==null){
    const dx=mouse.x-mouse.prevX,dy=mouse.y-mouse.prevY;
    const dist=Math.hypot(dx,dy);
    if(dist>3)squishSound(Math.min(1,dist/80));
  }
}

function releaseSlime(){
  if(slime.drag!==null)squishSound(.3);
  slime.drag=null;
}

function updateSlime(){
  if(slime.points.length===0)return;
  // Drag: move dragged point to mouse
  if(slime.drag!==null){
    slime.points[slime.drag].x=mouse.x;
    slime.points[slime.drag].y=mouse.y;
  }
  // Verlet integration (no pinned points!)
  slime.points.forEach((p,i)=>{
    if(i===slime.drag)return;
    const vx=(p.x-p.px)*0.985;
    const vy=(p.y-p.py)*0.985;
    p.px=p.x;p.py=p.y;
    p.x+=vx;p.y+=vy;
    p.y+=0.3; // gentle gravity
  });
  // Constraints
  for(let k=0;k<5;k++){
    slime.sticks.forEach(s=>{
      const p1=slime.points[s.p1],p2=slime.points[s.p2];
      const dx=p2.x-p1.x,dy=p2.y-p1.y;
      const d=Math.hypot(dx,dy)||1;
      const diff=(s.len-d)/d*(s.k||1)*0.5;
      const ox=dx*diff,oy=dy*diff;
      if(s.p1!==slime.drag){p1.x-=ox;p1.y-=oy;}
      if(s.p2!==slime.drag){p2.x+=ox;p2.y+=oy;}
    });
    // Bounds (bounce off edges)
    slime.points.forEach(p=>{
      if(p.x<5){p.x=5;}if(p.x>W-5){p.x=W-5;}
      if(p.y<5){p.y=5;}if(p.y>H-5){p.y=H-5;}
    });
  }
}

function drawSlime(){
  if(slime.points.length===0)return;
  const pts=slime.points;
  const n=pts.length;
  // Centroid
  let cx=0,cy=0;pts.forEach(p=>{cx+=p.x;cy+=p.y;});
  cx/=n;cy/=n;
  let maxR=0;pts.forEach(p=>{const d=Math.hypot(p.x-cx,p.y-cy);if(d>maxR)maxR=d;});
  maxR=Math.max(maxR+50,50);
  // Glow shadow
  ctx.save();
  ctx.shadowBlur=40;ctx.shadowColor='rgba(124,92,255,.5)';
  // Smooth curve
  ctx.beginPath();
  const m0x=(pts[0].x+pts[1].x)/2,m0y=(pts[0].y+pts[1].y)/2;
  ctx.moveTo(m0x,m0y);
  for(let i=1;i<n;i++){
    const p1=pts[i],p2=pts[(i+1)%n];
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    ctx.quadraticCurveTo(p1.x,p1.y,mx,my);
  }
  ctx.closePath();
  // Gradient
  const grad=ctx.createRadialGradient(cx-maxR*.3,cy-maxR*.3,0,cx,cy,maxR);
  grad.addColorStop(0,'#80e8ff');
  grad.addColorStop(.4,'#00d9ff');
  grad.addColorStop(1,'#7c5cff');
  ctx.fillStyle=grad;
  ctx.fill();
  ctx.restore();
  // Inner shine
  ctx.beginPath();
  ctx.moveTo(m0x,m0y);
  for(let i=1;i<n;i++){
    const p1=pts[i],p2=pts[(i+1)%n];
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    ctx.quadraticCurveTo(p1.x,p1.y,mx,my);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.06)';
  ctx.fill();
  // Big shine
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.ellipse(cx-maxR*.25,cy-maxR*.35,maxR*.3,maxR*.12,-.5,0,TAU);
  ctx.fill();
  // Small shine
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.beginPath();
  ctx.arc(cx-maxR*.3,cy-maxR*.4,maxR*.06,0,TAU);
  ctx.fill();
}

// ==========================================
// 2. BUBBLES — Realistic Bubble Wrap
// ==========================================
let bubbles=[],popParts=[];

function initBubbles(){
  bubbles=[];popParts=[];
  const r=18; // smaller = more realistic
  const gap=3;
  const cols=Math.floor((W-10)/(r*2+gap));
  const rows=Math.floor((H-10)/(r*2+gap));
  const startX=(W-cols*(r*2+gap))/2;
  const startY=(H-rows*(r*2+gap))/2;
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      bubbles.push({
        x:startX+x*(r*2+gap)+r,
        y:startY+y*(r*2+gap)+r,
        r:r,
        popped:false,popT:0,
        jiggle:0,jigglePhase:rand(0,TAU),
        // Each bubble slightly transparent with random tint
        tint:rand(0,360),
        tintAmt:rand(.02,.08)
      });
    }
  }
}

function checkBubbles(){
  let poppedCount=0;
  bubbles.forEach(b=>{
    if(b.popped)return;
    const d=Math.hypot(mouse.x-b.x,mouse.y-b.y);
    if(d<b.r+3){
      b.popped=true;b.popT=1;
      poppedCount++;
      // Particles
      for(let i=0;i<12;i++){
        const a=rand(0,TAU),sp=rand(40,160);
        popParts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rand(1,3),life:rand(.3,.6),maxLife:.6,gravity:true});
      }
      // Ring
      for(let i=0;i<6;i++){
        const a=i/6*TAU;
        popParts.push({x:b.x,y:b.y,vx:Math.cos(a)*80,vy:Math.sin(a)*80,r:1,life:.4,maxLife:.4,gravity:false,ring:true});
      }
      // Jiggle neighbors
      bubbles.forEach(b2=>{
        if(b2===b||b2.popped)return;
        const dd=Math.hypot(b2.x-b.x,b2.y-b.y);
        if(dd<b.r*3){b2.jiggle=.4;b2.jigglePhase+=.2;}
      });
    }
  });
  if(poppedCount>0)popSound(1+poppedCount*0.12);
}

function updateBubbles(){
  bubbles.forEach(b=>{
    if(b.popT>0)b.popT-=0.06;
    if(b.jiggle>0)b.jiggle*=.9;
    b.jigglePhase+=0.03;
  });
  for(let i=popParts.length-1;i>=0;i--){
    const p=popParts[i];
    p.x+=p.vx*0.016;p.y+=p.vy*0.016;
    if(p.gravity)p.vy+=250*0.016;
    p.vx*=.95;p.vy*=.95;
    p.life-=0.016;
    if(p.life<=0)popParts.splice(i,1);
  }
}

function drawBubbles(){
  // Draw the "plastic sheet" background
  ctx.fillStyle='rgba(200,200,210,.04)';
  ctx.fillRect(0,0,W,H);
  // Subtle plastic texture lines
  ctx.strokeStyle='rgba(255,255,255,.015)';
  ctx.lineWidth=1;
  for(let y=0;y<H;y+=4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  bubbles.forEach(b=>{
    if(b.popped&&b.popT<=0)return;
    if(b.popped){
      // Pop: small ring + tiny particles already spawned
      const exp=(1-b.popT)*12;
      ctx.strokeStyle=`rgba(255,255,255,${b.popT*.4})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+exp,0,TAU);ctx.stroke();
    }else{
      const jr=b.r*(1+Math.sin(b.jigglePhase)*b.jiggle*0.12);
      // Shadow under bubble (on the plastic)
      ctx.fillStyle='rgba(0,0,0,.08)';
      ctx.beginPath();ctx.arc(b.x,b.y+jr*0.15,jr*0.95,0,TAU);ctx.fill();
      // Bubble body — translucent hemisphere look
      // Base layer (slightly tinted transparent)
      const grad=ctx.createRadialGradient(b.x-jr*.35,b.y-jr*.35,0,b.x,b.y,jr);
      grad.addColorStop(0,`rgba(255,255,255,.35)`);
      grad.addColorStop(.3,`rgba(255,255,255,.12)`);
      grad.addColorStop(.7,`rgba(${200+Math.sin(b.tint)*30},${200+Math.cos(b.tint)*30},220,${b.tintAmt})`);
      grad.addColorStop(1,`rgba(150,150,170,.25)`);
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(b.x,b.y,jr,0,TAU);ctx.fill();
      // Rim (bottom-right dark edge — gives 3D depth)
      ctx.strokeStyle='rgba(100,100,130,.2)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,jr-0.5,0,TAU);ctx.stroke();
      // Main highlight (top-left, large)
      ctx.fillStyle='rgba(255,255,255,.35)';
      ctx.beginPath();
      ctx.ellipse(b.x-jr*.3,b.y-jr*.3,jr*.35,jr*.25,-.6,0,TAU);
      ctx.fill();
      // Small bright spot
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath();
      ctx.arc(b.x-jr*.35,b.y-jr*.35,jr*.1,0,TAU);
      ctx.fill();
      // Bottom rim light (reflected light from below)
      ctx.fillStyle='rgba(255,255,255,.06)';
      ctx.beginPath();
      ctx.ellipse(b.x+jr*.2,b.y+jr*.35,jr*.3,jr*.1,.3,0,TAU);
      ctx.fill();
    }
  });
  // Particles
  popParts.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=p.ring?'rgba(255,255,255,.4)':'rgba(255,255,255,.5)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ==========================================
// 3. SAND — improved
// ==========================================
let sandCanvas,sandCtx,sandParts=[];

function initSand(){
  sandParts=[];
  sandCanvas=document.createElement('canvas');
  sandCanvas.width=W;sandCanvas.height=H;
  sandCtx=sandCanvas.getContext('2d');
  const grad=sandCtx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#f4a261');
  grad.addColorStop(.5,'#e76f51');
  grad.addColorStop(1,'#c1543c');
  sandCtx.fillStyle=grad;
  sandCtx.fillRect(0,0,W,H);
  // Layered texture
  for(let i=0;i<10000;i++){
    const a=Math.random()*.4;
    const c=Math.random()>.5?255:0;
    sandCtx.fillStyle=`rgba(${c},${c},${c},${a})`;
    sandCtx.fillRect(Math.random()*W,Math.random()*H,rand(1,2),rand(1,2));
  }
  // Grain clusters
  for(let i=0;i<300;i++){
    const x=Math.random()*W,y=Math.random()*H;
    sandCtx.fillStyle='rgba(255,200,100,.15)';
    sandCtx.beginPath();sandCtx.arc(x,y,rand(2,6),0,TAU);sandCtx.fill();
  }
  // Vignette
  const vg=sandCtx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,.35)');
  sandCtx.fillStyle=vg;
  sandCtx.fillRect(0,0,W,H);
}

function cutSand(){
  if(!sandCtx)return;
  const dx=mouse.x-mouse.prevX,dy=mouse.y-mouse.prevY;
  const dist=Math.hypot(dx,dy);
  if(dist>1){
    for(let i=0;i<Math.min(dist/2,10);i++){
      const t=Math.random();
      const px=mouse.prevX+dx*t+rand(-15,15);
      const py=mouse.prevY+dy*t+rand(-15,15);
      sandParts.push({x:px,y:py,vx:rand(-30,30),vy:rand(-60,-10),r:rand(1.5,4),hue:rand(15,40),life:1.5});
    }
    if(dist>5)sandSound();
  }
  sandCtx.globalCompositeOperation='destination-out';
  sandCtx.lineWidth=50;
  sandCtx.lineCap='round';
  sandCtx.lineJoin='round';
  sandCtx.beginPath();
  sandCtx.moveTo(mouse.prevX,mouse.prevY);
  sandCtx.lineTo(mouse.x,mouse.y);
  sandCtx.stroke();
  // Feather edge
  sandCtx.lineWidth=60;
  sandCtx.globalAlpha=.25;
  sandCtx.beginPath();
  sandCtx.moveTo(mouse.prevX,mouse.prevY);
  sandCtx.lineTo(mouse.x,mouse.y);
  sandCtx.stroke();
  sandCtx.globalAlpha=1;
  sandCtx.globalCompositeOperation='source-over';
}

function updateSand(){
  for(let i=sandParts.length-1;i>=0;i--){
    const p=sandParts[i];
    p.x+=p.vx*0.016;p.y+=p.vy*0.016;
    p.vy+=400*0.016;
    p.vx*=0.99;
    p.life-=0.016;
    if(p.life<=0||p.y>H+20)sandParts.splice(i,1);
  }
}

function drawSand(){
  ctx.fillStyle='#0a0a0e';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(124,92,255,.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const glow=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.4);
  glow.addColorStop(0,'rgba(124,92,255,.06)');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(sandCanvas,0,0);
  sandParts.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/1.5,0,1);
    ctx.fillStyle=`hsl(${p.hue},70%,55%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(mouse.down){
    ctx.strokeStyle='rgba(255,255,255,.12)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,26,0,TAU);ctx.stroke();
  }
}

// ==========================================
// LOOP
// ==========================================
function loop(){
  ctx.clearRect(0,0,W,H);
  if(currentTool==='slime'){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a0a14');
    bg.addColorStop(1,'#0e0a1a');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(124,92,255,.05)';
    ctx.beginPath();ctx.arc(W*.2,H*.3,200,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(0,217,255,.04)';
    ctx.beginPath();ctx.arc(W*.8,H*.7,200,0,TAU);ctx.fill();
    updateSlime();drawSlime();
  }else if(currentTool==='bubbles'){
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0c0c10');
    bg.addColorStop(1,'#101018');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    updateBubbles();drawBubbles();
  }else if(currentTool==='sand'){
    updateSand();drawSand();
  }
  requestAnimationFrame(loop);
}

initSlime();
loop();
</script>
